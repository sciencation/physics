<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>電位の導入：位置エネルギーと運動エネルギー</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            margin-top: 20px;
            background-color: #f5f6fa;
        }
        .container {
            display: flex;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .sim-wrapper {
            position: relative;
            width: fit-content;
        }
        canvas {
            border: 1px solid #ccc;
            background-color: #fafafa;
            border-radius: 5px;
            cursor: grab;
        }
        canvas:active {
            cursor: grabbing;
        }
        .graph-container {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            width: 140px;
            height: 300px;
            border-left: 2px solid #333;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            padding-left: 10px;
            position: absolute;
            left: 14px;
            top: 14px;
            background: rgba(255, 255, 255, 0.86);
            border-radius: 6px;
        }
        .bar-group {
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            height: 100%;
            width: 100%;
        }
        .bar-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            justify-content: flex-end;
            width: 45%;
        }
        .bar {
            width: 100%;
            transition: height 0.05s linear; /* 動きを少し滑らかにする */
        }
        .bar-u {
            background-color: #3498db; /* 位置エネルギーは青 */
        }
        .bar-k {
            background-color: #e67e22; /* 運動エネルギーはオレンジ */
        }
        .label {
            margin-top: 5px;
            font-weight: bold;
            font-size: 14px;
            text-align: center;
        }
        .controls {
            margin-top: 15px;
            text-align: center;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:hover {
            background-color: #27ae60;
        }
    </style>
</head>
<body>

<div class="container">
    <div>
        <div class="sim-wrapper">
        <canvas id="simCanvas" width="680" height="400"></canvas>
        <div class="graph-container">
            <div style="position: absolute; top: -25px; left: 0; font-weight: bold;">エネルギー</div>
            <div class="bar-group">
                <div class="bar-wrapper">
                    <div class="bar bar-u" id="barU" style="height: 0%;"></div>
                    <div class="label">位置<br>U</div>
                </div>
                <div class="bar-wrapper">
                    <div class="bar bar-k" id="barK" style="height: 0%;"></div>
                    <div class="label">運動<br>K</div>
                </div>
            </div>
        </div>
        </div>
        <div class="controls">
            <button onclick="resetSimulation()">はじめからやり直す</button>
            <p style="font-size: 14px; color: #555;">試験電荷（小さい赤丸）をドラッグして近づけ、手を離してみてください。</p>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    const barU = document.getElementById('barU');
    const barK = document.getElementById('barK');

    // 物理シミュレーション用の定数（見た目優先の調整値）
    const K_QQ = 110000; // クーロン定数×Q×q に相当する係数（さらに弱めて速度を抑える）
    const MASS = 2.0;    // 試験電荷の質量
    const MIN_DIST = 26; // 衝突を防ぐ最小距離
    const TIME_STEP = 0.35; // 1フレームあたりの進み方（小さいほどゆっくり）

    // 固定された電荷 (+Q)
    const fixedCharge = { x: canvas.width / 2, y: canvas.height / 2, radius: 14 };
    
    // 試験電荷 (+q)
    let testCharge = { x: canvas.width - 50, y: canvas.height / 2, radius: 7, vx: 0, vy: 0 };
    
    let isDragging = false;
    let isReleased = false;
    let totalEnergy = 0; // 手を離した瞬間に決定される全力学的エネルギー

    // 距離を計算する関数
    function getDistance(p1, p2) {
        const dx = p1.x - p2.x;
        const dy = p1.y - p2.y;
        return Math.sqrt(dx * dx + dy * dy);
    }

    // 初期化・リセット処理
    function resetSimulation() {
        testCharge = { x: canvas.width - 50, y: canvas.height / 2, radius: 7, vx: 0, vy: 0 };
        isDragging = false;
        isReleased = false;
        totalEnergy = 0;
    }

    // マウス・タッチ操作のイベントリスナー
    function getMousePos(evt) {
        const rect = canvas.getBoundingClientRect();
        return {
            x: evt.clientX - rect.left,
            y: evt.clientY - rect.top
        };
    }

    canvas.addEventListener('mousedown', (e) => {
        const pos = getMousePos(e);
        const dist = getDistance(pos, testCharge);
        if (dist < testCharge.radius * 2) {
            isDragging = true;
            isReleased = false;
            testCharge.vx = 0;
            testCharge.vy = 0;
        }
    });

    canvas.addEventListener('mousemove', (e) => {
        if (isDragging) {
            const pos = getMousePos(e);
            // 固定電荷に近すぎないように制限
            const distToFixed = getDistance(pos, fixedCharge);
            if (distToFixed > MIN_DIST) {
                testCharge.x = pos.x;
                testCharge.y = pos.y;
            } else {
                // 最小距離にクランプ
                const angle = Math.atan2(pos.y - fixedCharge.y, pos.x - fixedCharge.x);
                testCharge.x = fixedCharge.x + Math.cos(angle) * MIN_DIST;
                testCharge.y = fixedCharge.y + Math.sin(angle) * MIN_DIST;
            }
        }
    });

    canvas.addEventListener('mouseup', () => {
        if (isDragging) {
            isDragging = false;
            isReleased = true;
            // 手を離した瞬間の位置エネルギーを全力学的エネルギーとする (初速度0のため)
            const r = getDistance(testCharge, fixedCharge);
            totalEnergy = K_QQ / r; 
        }
    });

    // 描画関数
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 背景のグリッド（空間を意識させるため）
        ctx.strokeStyle = '#eee';
        ctx.lineWidth = 1;
        for(let i=0; i<canvas.width; i+=50) {
            ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
        }

        const r = getDistance(testCharge, fixedCharge);

        // 物理演算（手を離している間）
        if (isReleased) {
            if (r > MIN_DIST) {
                // F = kQq / r^2
                const force = K_QQ / (r * r);
                const angle = Math.atan2(testCharge.y - fixedCharge.y, testCharge.x - fixedCharge.x);
                
                // a = F / m
                const ax = (force * Math.cos(angle)) / MASS;
                const ay = (force * Math.sin(angle)) / MASS;

                // 速度と位置の更新 (簡易オイラー法)
                testCharge.vx += ax * TIME_STEP;
                testCharge.vy += ay * TIME_STEP;
                testCharge.x += testCharge.vx * TIME_STEP;
                testCharge.y += testCharge.vy * TIME_STEP;
            }
            
            // 画面外に出たら動きを止める（エネルギーバーはそのまま）
            if (testCharge.x > canvas.width + 50 || testCharge.x < -50 || 
                testCharge.y > canvas.height + 50 || testCharge.y < -50) {
                isReleased = false; 
            }
        }

        // エネルギーの計算とバーグラフの更新
        let currentU = K_QQ / r;
        let currentK = 0;

        if (isDragging) {
            // ドラッグ中は持っている位置エネルギー＝全エネルギー
            totalEnergy = currentU; 
        } else if (isReleased) {
            // 手を離した後はエネルギー保存
            currentK = totalEnergy - currentU;
            if (currentK < 0) currentK = 0;
        } else if (!isDragging && !isReleased && totalEnergy > 0) {
            // 画面外に飛んでいった後の状態保持
            currentU = 0;
            currentK = totalEnergy;
        }

        // グラフの描画更新（最大値を設定してパーセント計算）
        const MAX_ENERGY = K_QQ / MIN_DIST; 
        const uPercent = Math.min((currentU / MAX_ENERGY) * 100, 100);
        const kPercent = Math.min((currentK / MAX_ENERGY) * 100, 100);
        
        barU.style.height = `${uPercent}%`;
        barK.style.height = `${kPercent}%`;

        // --- 描画処理 ---

        // ドラッグ中の「反発力」の矢印描画
        if (isDragging) {
            const forceMag = (K_QQ / (r * r)) * 0.1; // 見た目のためのスケール
            const angle = Math.atan2(testCharge.y - fixedCharge.y, testCharge.x - fixedCharge.x);
            const arrowEndX = testCharge.x + Math.cos(angle) * forceMag;
            const arrowEndY = testCharge.y + Math.sin(angle) * forceMag;

            ctx.strokeStyle = 'red';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(testCharge.x, testCharge.y);
            ctx.lineTo(arrowEndX, arrowEndY);
            ctx.stroke();

            // 矢印の先端
            ctx.beginPath();
            ctx.moveTo(arrowEndX, arrowEndY);
            ctx.lineTo(arrowEndX - 10 * Math.cos(angle - Math.PI/6), arrowEndY - 10 * Math.sin(angle - Math.PI/6));
            ctx.lineTo(arrowEndX - 10 * Math.cos(angle + Math.PI/6), arrowEndY - 10 * Math.sin(angle + Math.PI/6));
            ctx.fillStyle = 'red';
            ctx.fill();
        }

        // 固定電荷 (+Q)
        ctx.beginPath();
        ctx.arc(fixedCharge.x, fixedCharge.y, fixedCharge.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#e74c3c'; // 赤
        ctx.fill();
        ctx.strokeStyle = '#c0392b';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = 'white';
        ctx.font = 'bold 16px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('+Q', fixedCharge.x, fixedCharge.y);

        // 試験電荷 (+q)
        ctx.beginPath();
        ctx.arc(testCharge.x, testCharge.y, testCharge.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#ff7675'; // 薄い赤
        ctx.fill();
        ctx.strokeStyle = '#d63031';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = 'black';
        ctx.font = '12px sans-serif';
        ctx.fillText('+q', testCharge.x, testCharge.y - 12);

        requestAnimationFrame(draw);
    }

    // シミュレーション開始
    draw();
</script>

</body>
</html>
